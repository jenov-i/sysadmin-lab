<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .t { font-size: 25px; font-weight: 700; fill: #1a202c; }
      .s { font-size: 14px; fill: #4a5568; }
      .ca { fill: #fff5f5; stroke: #c53030; stroke-width: 2; }
      .srv { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 2; }
      .cli { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .b { fill: #ffffff; stroke: #4a5568; stroke-width: 2; }
      .l { font-size: 15.5px; font-weight: 700; fill: #1a202c; }
      .m { font-family: DejaVu Sans Mono, monospace; font-size: 12.5px; fill: #2d3748; }
      .n { font-size: 12px; fill: #4a5568; }
      .f { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#ar); }
      .sign { stroke: #c53030; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ar); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="40" y="50">CA racine, certificat serveur et révocation</text>
  <text class="s" x="40" y="76">srv-debian13 · OpenSSL 3.5.7 · nginx 1.26.3 · TLS 1.3 sur 10.0.3.10:8443</text>

  <!-- CA -->
  <rect class="ca" x="40" y="120" width="330" height="190" rx="10"/>
  <text class="l" x="62" y="152">lab-sysadmin Root CA</text>
  <text class="m" x="62" y="180">ca.key   RSA 4096, AES-256</text>
  <text class="m" x="62" y="202">ca.crt   auto-signé, 10 ans</text>
  <text class="m" x="62" y="224">CA:TRUE, pathlen:0</text>
  <text class="m" x="62" y="246">keyCertSign, cRLSign</text>
  <text class="n" x="62" y="274">phrase de passe : /root/pki/ca.pass (600)</text>
  <text class="n" x="62" y="294">clé privée jamais publiée</text>

  <!-- CSR / cert -->
  <rect class="srv" x="470" y="105" width="330" height="205" rx="10"/>
  <text class="l" x="492" y="137">Certificat serveur</text>
  <text class="m" x="492" y="165">CN = srv-debian13.lab.local</text>
  <text class="m" x="492" y="187">SAN DNS + IP:10.0.3.10</text>
  <text class="m" x="492" y="209">EKU serverAuth</text>
  <text class="m" x="492" y="231">397 jours, SHA-256</text>
  <text class="n" x="492" y="259">généré depuis server.csr, signé par la CA</text>
  <text class="n" x="492" y="279">clé privée locale, mode 600</text>

  <!-- nginx -->
  <rect class="b" x="900" y="105" width="260" height="205" rx="10"/>
  <text class="l" x="922" y="137">nginx :8443</text>
  <text class="m" x="922" y="165">ssl_certificate</text>
  <text class="m" x="944" y="185">server.crt</text>
  <text class="m" x="922" y="207">ssl_certificate_key</text>
  <text class="m" x="944" y="227">server.key</text>
  <text class="n" x="922" y="255">TLS 1.2 / 1.3</text>
  <text class="n" x="922" y="275">testé en TLS 1.3</text>

  <!-- verification -->
  <rect class="cli" x="40" y="370" width="540" height="190" rx="10"/>
  <text class="l" x="62" y="402">Vérification côté client</text>
  <text class="m" x="62" y="430">curl --cacert ca.crt</text>
  <text class="n" x="62" y="450">→ HTTP 200, ssl_verify_result 0</text>
  <text class="m" x="62" y="478">openssl s_client -verify_hostname ...</text>
  <text class="n" x="62" y="498">→ TLSv1.3, Verify return code 0 (ok)</text>
  <text class="n" x="62" y="526">sans la CA → unable to get local issuer certificate</text>
  <text class="n" x="62" y="544">mauvais nom → error 62: hostname mismatch</text>

  <!-- revocation -->
  <rect class="b" x="640" y="370" width="520" height="190" rx="10"/>
  <text class="l" x="662" y="402">Révocation</text>
  <text class="m" x="662" y="430">obsolete.crt  (serial 1001)</text>
  <text class="n" x="662" y="450">index.txt : R · 15/11/2026</text>
  <text class="m" x="662" y="478">openssl ca -gencrl</text>
  <text class="n" x="662" y="498">CRL publiée, valable jusqu'au 12/11/2036</text>
  <text class="m" x="662" y="526">verify -crl_check</text>
  <text class="n" x="662" y="546">révoqué → error 23 · serveur → OK</text>

  <!-- bas -->
  <rect class="b" x="40" y="610" width="1120" height="56" rx="8"/>
  <text class="n" x="60" y="644">Chaîne prouvée : racine auto-signée → CSR → signature → nginx → vérification client, puis émission/révocation d'un second certificat et contrôle par CRL.</text>

  <path class="sign" d="M 370 180 L 466 180"/>
  <text class="n" x="378" y="168">signe</text>
  <path class="f" d="M 800 200 L 896 200"/>
  <text class="n" x="812" y="188">installe</text>
  <path class="f" d="M 580 310 L 400 366"/>
  <text class="n" x="470" y="340">vérifie</text>
</svg>
