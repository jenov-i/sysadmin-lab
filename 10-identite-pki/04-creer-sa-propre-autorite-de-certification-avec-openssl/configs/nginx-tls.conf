# Site interne en HTTPS, servi par nginx avec le certificat émis par la CA du lab.
# Le port 8080 reste occupé par le dépôt APT : on ajoute un vhost dédié.
server {
    listen 8443 ssl;
    server_name srv-debian13.lab.local www.lab.local;

    root /srv/www-tls;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:TLSlab:2m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=300" always;
}
