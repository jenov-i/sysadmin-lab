name: Vérification des projets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  projets:
    name: README, liens, captures, secrets
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Contrôler les projets
        run: python3 tools/check_projects.py
