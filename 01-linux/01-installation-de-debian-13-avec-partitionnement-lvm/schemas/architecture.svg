<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1a202c; }
      .sub   { font-size: 14px; fill: #4a5568; }
      .disk  { fill: #edf2f7; stroke: #2d3748; stroke-width: 2; }
      .part  { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
      .lv    { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 1.5; }
      .swap  { fill: #fff5f5; stroke: #c53030; stroke-width: 1.5; }
      .vg    { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .label { font-size: 15px; font-weight: 600; fill: #1a202c; }
      .meta  { font-size: 12.5px; fill: #4a5568; }
      .mount { font-size: 13px; font-weight: 600; fill: #2b6cb0; }
      .link  { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="title" x="40" y="52">srv-debian13 — schéma de partitionnement</text>
  <text class="sub" x="40" y="78">Debian 13.2 (trixie) · disque virtio /dev/vda de 20 Gio · LVM2 · GRUB en mode BIOS</text>

  <!-- Disque -->
  <rect class="disk" x="40" y="120" width="250" height="520" rx="10"/>
  <text class="label" x="60" y="150">/dev/vda — 20 Gio</text>
  <text class="meta" x="60" y="170">table de partitions msdos</text>

  <!-- vda1 -->
  <rect class="part" x="60" y="190" width="210" height="78" rx="6"/>
  <text class="label" x="76" y="216">vda1</text>
  <text class="meta" x="76" y="236">512 Mio · ext4</text>
  <text class="mount" x="76" y="256">/boot</text>

  <!-- vda2 extended -->
  <rect class="part" x="60" y="284" width="210" height="336" rx="6" fill="#f7fafc" stroke-dasharray="6 4"/>
  <text class="label" x="76" y="310">vda2</text>
  <text class="meta" x="76" y="330">partition étendue</text>

  <!-- vda5 -->
  <rect class="part" x="78" y="348" width="176" height="254" rx="6"/>
  <text class="label" x="94" y="376">vda5</text>
  <text class="meta" x="94" y="396">19,5 Gio</text>
  <text class="meta" x="94" y="416">LVM2_member</text>
  <text class="meta" x="94" y="436">PV du groupe</text>
  <text class="meta" x="94" y="456">debian-vg</text>

  <!-- flèche vers le VG -->
  <path class="link" d="M 292 475 L 372 475"/>

  <!-- VG -->
  <rect class="vg" x="380" y="120" width="780" height="520" rx="10"/>
  <text class="label" x="404" y="152">Groupe de volumes debian-vg — 19,52 Gio</text>
  <text class="meta" x="404" y="172">1 PV (/dev/vda5) · 5 LV logiques · ext4 + swap</text>

  <!-- LVs -->
  <rect class="lv" x="404" y="196" width="732" height="74" rx="6"/>
  <text class="label" x="424" y="224">debian-vg-root</text>
  <text class="meta" x="424" y="246">5,72 Gio · ext4 · errors=remount-ro</text>
  <text class="mount" x="1000" y="232" text-anchor="end">/</text>

  <rect class="lv" x="404" y="284" width="732" height="74" rx="6"/>
  <text class="label" x="424" y="312">debian-vg-var</text>
  <text class="meta" x="424" y="334">2,86 Gio · ext4 — journaux, bases, conteneurs</text>
  <text class="mount" x="1000" y="320" text-anchor="end">/var</text>

  <rect class="lv" x="404" y="372" width="732" height="74" rx="6"/>
  <text class="label" x="424" y="400">debian-vg-home</text>
  <text class="meta" x="424" y="422">1,91 Gio · ext4 — données utilisateurs</text>
  <text class="mount" x="1000" y="408" text-anchor="end">/home</text>

  <rect class="lv" x="404" y="460" width="732" height="74" rx="6"/>
  <text class="label" x="424" y="488">debian-vg-tmp</text>
  <text class="meta" x="424" y="510">7,13 Gio · ext4 — isolé du système</text>
  <text class="mount" x="1000" y="496" text-anchor="end">/tmp</text>

  <rect class="swap" x="404" y="548" width="732" height="74" rx="6"/>
  <text class="label" x="424" y="576">debian-vg-swap</text>
  <text class="meta" x="424" y="598">1,91 Gio · swap (pas de fichier d'échange)</text>
  <text class="mount" x="1000" y="584" text-anchor="end" fill="#c53030">[SWAP]</text>
</svg>
