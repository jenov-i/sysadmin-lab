# chrony.conf — client NTP du lab (srv-time)
# Déposé dans /etc/chrony/chrony.conf par scripts/03-chrony.sh.
# L'original Debian est conservé dans /root/avant-chrony/.

# Sources : pool Debian, quatre sources au plus, interrogation rapide au départ.
pool 2.debian.pool.ntp.org iburst maxsources 4

# Dérive estimée de l'horloge locale, réutilisée au démarrage.
driftfile /var/lib/chrony/chrony.drift

# Si l'écart dépasse 1 s au démarrage, corriger d'un coup (pas de rattrapage lent).
makestep 1.0 3

# Tenir la RTC à l'heure (utile au prochain démarrage, avant le réseau).
rtcsync

# Journal des mesures, pour relire la dérive après coup.
logdir /var/log/chrony
log tracking statistics

# Le serveur ne sert pas le temps au réseau : il est client.
port 0
