# Serveur NTP du lab — srv-debian13, 10.0.3.10
# Amont : pool Debian. Aval : le LAN client 10.0.9.0/24.

pool 2.debian.pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift
rtcsync
makestep 1 3
maxupdateskew 100.0

# Seuls les clients de ce réseau peuvent interroger le serveur.
allow 10.0.9.0/24

# Pas de « local stratum » : testé avec, chrony restait sur sa référence
# locale (stratum 10) au lieu de suivre l'amont. Le serveur ne sert donc
# que lorsqu'il est réellement synchronisé.

# Fichiers de clés et de commandes laissés par défaut.
keyfile /etc/chrony/chrony.keys
