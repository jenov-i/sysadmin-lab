# Site statique site.lab.local — déposé dans /etc/nginx/sites-available/
# Activé par un lien dans /etc/nginx/sites-enabled/ ; le site Debian par
# défaut est désactivé par le script 03.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Aucun contenu en clair : tout part en HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name site.lab.local www.site.lab.local;

    root  /var/www/site.lab.local/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/site.lab.local.crt;
    ssl_certificate_key /etc/nginx/tls/site.lab.local.key;

    # TLS 1.0 et 1.1 sont exclus ; les suites sont limitées à celles qui
    # offrent la confidentialité persistante (ECDHE) et AEAD.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # En-têtes de sécurité. Ils sont déclarés au niveau du serveur pour être
    # hérités par tous les blocs location (un add_header dans un location
    # remplacerait toute la liste).
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        access_log off;
    }

    location ~* \.(css|svg|png)$ {
        expires 7d;
    }

    access_log /var/log/nginx/site.lab.local.access.log;
    error_log  /var/log/nginx/site.lab.local.error.log warn;
}
