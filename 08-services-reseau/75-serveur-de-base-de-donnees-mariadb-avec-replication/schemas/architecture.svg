<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#276749"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
    <style>
      .t { font-size: 25px; font-weight: 700; fill: #1a202c; }
      .s { font-size: 14px; fill: #4a5568; }
      .l { font-size: 16px; font-weight: 700; fill: #1a202c; }
      .m { font-family: DejaVu Sans Mono, monospace; font-size: 12.5px; fill: #2d3748; }
      .n { font-size: 12.5px; fill: #4a5568; }
      .srv { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 2; }
      .rep { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .cli { fill: #ffffff; stroke: #4a5568; stroke-width: 2; }
      .box { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.5; }
      .f { stroke: #2b6cb0; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
      .g { stroke: #276749; stroke-width: 2.5; fill: none; marker-end: url(#ar-g); }
      .x { stroke: #c53030; stroke-width: 2.5; fill: none; marker-end: url(#ar-r); stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="t" x="40" y="46">Réplication MariaDB 10.6 en GTID</text>
  <text class="s" x="40" y="72">lab-linux-01 (primaire) → lab-linux-02 (réplica) · base lab_boutique · réseau 192.168.99.0/24</text>

  <!-- Client applicatif -->
  <rect class="cli" x="40" y="170" width="215" height="150" rx="10"/>
  <text class="l" x="60" y="198">Client applicatif</text>
  <text class="m" x="60" y="226">app_boutique@</text>
  <text class="m" x="60" y="246">192.168.99.%</text>
  <text class="n" x="60" y="274">SELECT · INSERT</text>
  <text class="n" x="60" y="294">UPDATE · DELETE</text>

  <!-- Primaire -->
  <rect class="srv" x="390" y="120" width="330" height="290" rx="10"/>
  <text class="l" x="412" y="150">lab-linux-01</text>
  <text class="m" x="412" y="174">192.168.99.11</text>
  <text class="n" x="412" y="196">server_id = 11</text>
  <text class="n" x="412" y="216">read_only = OFF</text>

  <rect class="box" x="412" y="232" width="286" height="58" rx="6"/>
  <text class="m" x="426" y="254">mariadbd 10.6.23</text>
  <text class="n" x="426" y="276">binlog_format = ROW · strict_mode ON</text>

  <rect class="box" x="412" y="304" width="286" height="86" rx="6"/>
  <text class="l" x="426" y="326" style="font-size:14px">Journal binaire</text>
  <text class="m" x="426" y="348">mariadb-bin.000001</text>
  <text class="m" x="426" y="368">position 2 932 110</text>
  <text class="n" x="426" y="386">durabilité : sync_binlog = 1</text>

  <!-- Réplica -->
  <rect class="rep" x="880" y="120" width="280" height="290" rx="10"/>
  <text class="l" x="902" y="150">lab-linux-02</text>
  <text class="m" x="902" y="174">192.168.99.12</text>
  <text class="n" x="902" y="196">server_id = 12</text>
  <text class="n" x="902" y="216">read_only = ON</text>

  <rect class="box" x="902" y="232" width="236" height="58" rx="6"/>
  <text class="m" x="916" y="254">mariadbd 10.6.23</text>
  <text class="n" x="916" y="276">log_slave_updates = ON</text>

  <rect class="box" x="902" y="304" width="236" height="86" rx="6"/>
  <text class="l" x="916" y="326" style="font-size:14px">Journal relais</text>
  <text class="m" x="916" y="348">mariadb-relay-bin</text>
  <text class="m" x="916" y="368">gtid_slave_pos</text>
  <text class="m" x="916" y="386">0-11-67</text>

  <!-- Flèche applicative vers primaire -->
  <path class="f" d="M 255 230 L 380 230"/>
  <text class="n" x="262" y="222">MySQL 3306</text>

  <!-- Flux de réplication -->
  <path class="f" d="M 720 260 L 870 260"/>
  <text class="n" x="728" y="248">binlog → IO thread</text>
  <text class="n" x="728" y="278">repl@192.168.99.%</text>

  <!-- Boucle interne réplica -->
  <path class="g" d="M 836 330 L 872 330"/>
  <text class="n" x="752" y="322">SQL thread</text>

  <!-- Lecture client sur le réplica -->
  <path class="x" d="M 1020 410 L 1020 492 L 147 492 L 147 330"/>
  <text class="n" x="300" y="484">lecture seule possible · écriture refusée (ERROR 1290, read_only = ON)</text>

  <!-- Mesures -->
  <rect class="box" x="40" y="560" width="1120" height="120" rx="10"/>
  <text class="l" x="60" y="586">Mesures relevées</text>
  <text class="m" x="60" y="612">100 000 lignes chargées sur le primaire en 0,49 s → 2 812 152 octets de journal binaire</text>
  <text class="m" x="60" y="636">rattrapage du réplica : 644 ms · Seconds_Behind_Master : 0 · GTID identique 0-11-67 des deux côtés</text>
  <text class="n" x="60" y="662">Incidents rejoués et corrigés : compte absent de l'instantané (1130), GTID hors séquence (1950), clé dupliquée (1062), compteur de saut oublié</text>

  <!-- légende des états -->
</svg>
