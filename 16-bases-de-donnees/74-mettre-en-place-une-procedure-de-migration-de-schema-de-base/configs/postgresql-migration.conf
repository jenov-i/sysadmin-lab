# Réglages appliqués sur srv-debian13 le 15/11/2026, via ALTER SYSTEM
# (écrits dans /etc/postgresql/17/main/postgresql.auto.conf puis rechargés).
#
# Le volume /var ne fait que 4,5 Go après extension : borner le WAL évite
# de remplir la partition pendant un remplissage complet de la table.

max_wal_size = '256MB'
min_wal_size = '80MB'
