# Preseed Debian 13 (trixie) — installation non surveillée
# Partitionnement LVM écrit à la main : /boot ext4, swap, /, /var, /home, /tmp
# Lab : VM QEMU/KVM jetable, réseau utilisateur 10.0.2.0/24

### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i keymap select fr

### Réseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nas-omv8
d-i netcfg/get_domain string lab.local
d-i netcfg/wireless_wep string

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Africa/Brazzaville
d-i clock-setup/ntp boolean true

### Partitionnement : LVM, schéma manuel
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select custom-lvm
d-i partman-auto/expert_recipe string \
  boot-root :: \
    512 512 512 ext4 \
      $primary{ } $bootable{ } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
    2048 2048 2048 linux-swap \
      $lvmok{ } lv_name{ swap } method{ swap } format{ } . \
    6144 6144 1000000 ext4 \
      $lvmok{ } lv_name{ root } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
    3072 3072 1000000 ext4 \
      $lvmok{ } lv_name{ var } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ /var } . \
    2048 2048 1000000 ext4 \
      $lvmok{ } lv_name{ home } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ /home } . \
    1024 1024 1000000 ext4 \
      $lvmok{ } lv_name{ tmp } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ /tmp } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Comptes
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$labsalt$gsgx9/WlTGamiyXIkeGFQ2s7MAZq/ufX8wKWMh2ij/zhjfqOcbGleuHKq4IDF55TLagh7IPYLY4HYVgWeYC5p0
d-i passwd/make-user boolean false
d-i user-setup/allow-password-strong boolean true

### Paquets
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server lvm2 curl vim htop quota xfsprogs systemd-resolved
d-i pkgsel/upgrade select none
d-i pkgsel/updatedb boolean false
popularity-contest popularity-contest/participate boolean false

### Amorçage
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

### Fin : clé SSH du lab
d-i preseed/late_command string \
  mkdir -p /target/root/.ssh ; \
  echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ2z7lU+iG15aXUUA+NwJR7nrnktF+M4Nfvqw10cRX17 jenos@debian" > /target/root/.ssh/authorized_keys ; \
  chmod 700 /target/root/.ssh ; chmod 600 /target/root/.ssh/authorized_keys ; \
  in-target sh -c "sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config"

d-i finish-install/reboot_in_progress note
